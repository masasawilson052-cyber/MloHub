<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>You have been invited to MloHub</title>
</head>
<body style="margin:0;padding:0;background:#f7f4ee;font-family:Arial,Helvetica,sans-serif;color:#162033;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:560px;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #ece7df;">
          <tr>
            <td style="padding:28px 32px 18px;">
              <div style="font-size:24px;font-weight:800;color:#ff531f;">MloHub</div>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 32px;">
              <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2;color:#162033;">You're invited to MloHub</h1>
              <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#536174;">
                You have been invited to join MloHub. Tap the button below to accept your invitation and set up your account.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ff531f;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:12px;">
                Accept Invitation
              </a>
              <p style="margin:30px 0 0;font-size:13px;line-height:1.6;color:#7d8794;">
                If you were not expecting this invitation, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#faf8f4;border-top:1px solid #ece7df;font-size:12px;color:#9299a3;">
              © MloHub • Tanzania
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
