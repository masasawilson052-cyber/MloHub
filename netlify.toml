# ============================================================================
# MLOHUB NETLIFY DEPLOYMENT CONFIGURATION
# ============================================================================

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback & Expo Router dynamic path resolution
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimized caching for immutable static assets generated by Metro / Expo
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security & framing headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
